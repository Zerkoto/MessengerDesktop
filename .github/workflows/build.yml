name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore Messenger.csproj

      - name: Build
        run: dotnet build Messenger.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish Messenger.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Remove WebView2 user data from publish output
        shell: powershell
        run: |
          Get-ChildItem -Path publish -Recurse -Directory -Filter EBWebView -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force
          $leftovers = @(Get-ChildItem -Path publish -Recurse -Directory -Filter EBWebView -ErrorAction SilentlyContinue)
          if ($leftovers.Count -gt 0) { throw "Refusing to upload WebView2 user data." }

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-win-x64
          path: publish/
          if-no-files-found: error
